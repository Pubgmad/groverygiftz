<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Blue location-pin / G body -->
  <path d="M50 2C24.6 2 4 22.6 4 48c0 27 46 70 46 70s46-43 46-70C96 22.6 75.4 2 50 2z" fill="#2456D8"/>

  <!-- White bowl (creates the G negative space) -->
  <circle cx="47" cy="44" r="24" fill="white"/>

  <!-- Blue G right-side fill (makes it look like a G not an O) -->
  <rect x="47" y="30" width="30" height="28" fill="#2456D8"/>

  <!-- G crossbar white cutout -->
  <rect x="51" y="40" width="22" height="12" rx="2.5" fill="white"/>

  <!-- Orange ribbon band across the G opening -->
  <ellipse cx="50" cy="44" rx="47" ry="6" fill="#F47920" transform="rotate(-4 50 44)"/>

  <!-- Bow left wing -->
  <path d="M44 38 C38 27 20 29 25 40 C27 45 38 45 44 45Z" fill="#D06010"/>
  <!-- Bow right wing -->
  <path d="M56 38 C62 27 80 29 75 40 C73 45 62 45 56 45Z" fill="#D06010"/>
  <!-- Bow centre knot -->
  <ellipse cx="50" cy="42" rx="6.5" ry="5.5" fill="#E87015"/>

  <!-- Gift box at pin tip -->
  <rect x="38" y="84" width="24" height="16" rx="2.5" fill="#F47920"/>
  <rect x="35" y="80.5" width="30" height="6.5" rx="3.5" fill="#F47920"/>
  <!-- Box cross ribbon -->
  <rect x="48.5" y="80.5" width="3" height="19.5" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="35" y="89" width="30" height="2.5" rx="1" fill="white" opacity="0.85"/>
  <!-- Tiny bow on box top -->
  <path d="M46.5 80.5 Q43 75 40 77.5 Q38 79.5 46.5 80.5Z" fill="#D06010"/>
  <path d="M53.5 80.5 Q57 75 60 77.5 Q62 79.5 53.5 80.5Z" fill="#D06010"/>
  <circle cx="50" cy="80.5" r="2.8" fill="#D06010"/>
</svg>
